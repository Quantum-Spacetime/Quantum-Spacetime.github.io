<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page.title | escape }} — The Quiet Atlas</title><meta name="description" content="{{ page.summary | escape }}"><link rel="canonical" href="https://quantum-spacetime.github.io{{ page.url }}"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/adventures/journal.css"></head><body><nav class="wrap article-nav"><a class="logo" href="/adventures/">✳ THE QUIET ATLAS</a><a href="/adventures/#journal">← Journal</a></nav><main class="article"><p class="eyebrow">{{ page.category | escape }} · {{ page.location | escape }} · {{ page.date | date: "%d %b %Y" }}</p><h1>{{ page.title | escape }}</h1><p class="lead">{{ page.summary | escape }}</p>{% if page.cover != '' %}<img class="article-cover" src="{{ page.cover | escape }}" alt="{{ page.title | escape }}">{% else %}<div class="image-fallback">Field notes from the road</div>{% endif %}<div class="prose">{{ content }}</div><a class="text-link" href="/adventures/#journal">← ALL STORIES</a></main><script src="/adventures/images.js" defer></script></body></html>
