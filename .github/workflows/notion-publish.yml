name: Publish Notion journal
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quiet-atlas-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-notion.txt
      - run: python -m unittest discover -s tests -v
      - name: Export published articles
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo 'Notion is not activated. Deploying existing content only.'
          else
            python scripts/notion/publish.py
          fi
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site
      - run: python scripts/notion/check_site.py _site
      - name: Persist published content and optimized photographs
        run: |
          mkdir -p _notion_articles
          git add -A -- _notion_articles
          if [ -d adventures/images/notion ]; then git add -- adventures/images/notion; fi
          if ! git diff --cached --quiet; then
            git config user.name 'quiet-atlas-publisher[bot]'
            git config user.email 'quiet-atlas-publisher[bot]@users.noreply.github.com'
            git commit -m 'Publish Notion journal updates'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
